[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "fastapi[standard]>=0.141.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "ruff>=0.16.5",
    "sqlalchemy[asyncio]>=2.0.52",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "isort>=9.0.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.ruff]
src = ["app"]

[tool.ruff.lint]
select = ["I", "E", "F", "W", "TCH", "FAST"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true